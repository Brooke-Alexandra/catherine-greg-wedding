<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RSVPs · Catherine &amp; Greg (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--lime:#F3EFE7;--paper:#FBFAF6;--ink:#121212;--caper:#5E6440;--sand:#E8E0D2;--line:#D9D1C3;--muted:#6B675E;--decline:#8A4B2E}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--lime);color:var(--ink)}
  body{font:16px/1.55 Jost,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(28px,5vw,56px) max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px))}
  .serif{font-family:"Cormorant Garamond",Georgia,serif}
  .label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--caper)}
  .mono{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;line-height:1}
  .mono img{height:.68em;vertical-align:-.02em;margin:0 -.11em 0 -.06em}

  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px 32px;padding-bottom:28px;border-bottom:1px solid var(--ink)}
  header h1{margin:10px 0 0;font:400 clamp(44px,7vw,76px)/1 "Cormorant Garamond",Georgia,serif}
  .deadline{text-align:right}
  .deadline .big{font:400 30px/1.1 "Cormorant Garamond",Georgia,serif}
  .deadline .sub{font:italic 18px "Cormorant Garamond",Georgia,serif;color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
  .stat{padding:28px 20px 26px 0;display:flex;flex-direction:column;gap:6px}
  .stat+.stat{padding-left:20px;border-left:1px solid var(--line)}
  .stat .n{font:400 clamp(44px,6vw,64px)/1 "Cormorant Garamond",Georgia,serif}
  .stat.lead .n{font-size:clamp(56px,8vw,88px)}
  .stat .t{font-size:13px;color:var(--muted)}

  section{margin-top:clamp(44px,6vw,64px)}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px}
  .sec-head h2{margin:0;font:400 clamp(30px,4vw,40px)/1.1 "Cormorant Garamond",Georgia,serif}

  .events{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .ev{background:var(--paper);border:1px solid var(--sand);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
  .ev.main{background:var(--ink);color:var(--lime);border-color:var(--ink)}
  .ev .day{display:flex;align-items:baseline;gap:10px}
  .ev .num{font:400 44px/1 "Cormorant Garamond",Georgia,serif}
  .ev .dow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap}
  .ev .short{display:none}
  .ev .name{font:400 21px/1.2 "Cormorant Garamond",Georgia,serif;min-height:2.4em}
  .ev .counts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
  .ev .counts b{font:500 22px/1 Jost,sans-serif;margin-right:4px}
  .bar{height:3px;background:var(--line);position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--caper)}
  .ev.main .bar{background:rgba(243,239,231,.25)} .ev.main .bar i{background:#E2BE4A}
  .ev.main .label{color:#E2BE4A}

  .tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}
  .search{flex:1 1 260px;min-width:0;font:16px Jost,sans-serif;padding:12px 2px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
  .search:focus{outline:2px solid var(--caper);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:12px Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--lime);border-color:var(--ink)}
  .chip span{opacity:.6;margin-left:6px}

  .legend{display:flex;gap:14px;justify-content:flex-end;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:14px 0 10px;border-bottom:1px solid var(--ink)}
  .legend .cols{display:grid;grid-template-columns:repeat(4,34px);gap:6px;text-align:center;letter-spacing:.08em}
  .legend .cols span{display:flex;flex-direction:column;align-items:center;gap:2px}
  .legend .cols b{font:400 17px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:0;color:var(--ink)}
  .guest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
  .guest .who{min-width:0}
  .guest .nm{font:400 23px/1.2 "Cormorant Garamond",Georgia,serif}
  .guest .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);margin-left:8px;vertical-align:3px;color:var(--muted)}
  .tag.po{border-color:var(--caper);color:var(--caper)}
  .dots{display:grid;grid-template-columns:repeat(4,34px);gap:6px}
  .dot{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);font-size:12px;color:var(--muted)}
  .dot.y{background:var(--ink);border-color:var(--ink);color:var(--lime)}
  .dot.w{background:#E2BE4A;border-color:#E2BE4A;color:var(--ink)}
  .guest.declined .nm{color:var(--muted)}
  .declined-line{font:italic 17px "Cormorant Garamond",Georgia,serif;color:var(--decline)}
  .note{grid-column:1 / -1;font:italic 18px/1.4 "Cormorant Garamond",Georgia,serif;color:#3A3A3A;padding-left:14px;border-left:2px solid var(--sand)}
  .empty{padding:40px 0;text-align:center;font:italic 22px "Cormorant Garamond",Georgia,serif;color:var(--muted)}

  footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
  footer a{color:var(--ink)}

  @media (max-width:860px){.events{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat:nth-child(3){padding-left:0;border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .deadline{text-align:left}
    .legend{justify-content:flex-start}
    .guest{grid-template-columns:1fr}
    .ev .name{min-height:0}
    .ev .long{display:none} .ev .short{display:inline}
    .events{gap:10px} .ev{padding:18px 16px 16px} .ev .num{font-size:38px} .ev .name{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="mono">C <img src="images/gpp-amp.svg" alt="&amp;"> G</div>
      <h1>RSVPs</h1>
    </div>
    <div class="deadline">
      <div class="label">RSVP deadline · January 7th</div>
      <div class="big" id="days"></div>
      <div class="sub">July 5–8, 2027 · Malfa, Sicilia</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat lead"><span class="label">Coming to the wedding</span><span class="n" id="s-wed">0</span><span class="t" id="s-wed-t"></span></div>
    <div class="stat"><span class="label">Replies</span><span class="n" id="s-rep">0</span><span class="t">people, including plus ones</span></div>
    <div class="stat"><span class="label">Sending love</span><span class="n" id="s-dec">0</span><span class="t">can't make it</span></div>
    <div class="stat"><span class="label">Plus ones</span><span class="n" id="s-po">0</span><span class="t">coming with a guest</span></div>
  </div>

  <section>
    <div class="sec-head"><h2>The week</h2><span class="label">Coming · not coming</span></div>
    <div class="events" id="events"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Guests</h2><span class="label" id="shown"></span></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Search by name or email" aria-label="Search guests">
      <div class="chips" id="chips"></div>
    </div>
    <div class="legend"><div class="cols"><span>Mon<b>5</b></span><span>Tue<b>6</b></span><span>Wed<b>7</b></span><span>Thu<b>8</b></span></div></div>
    <div id="list"></div>
  </section>

  <footer>
    <span id="updated"></span>
    <a id="sheet" href="#" target="_blank" rel="noopener">Open the full sheet</a>
  </footer>
</div>

<script>
/* DATA: rows from the RSVP sheet (header row removed):
   [received, first, last, email, wedding, welcome, boat, farewell, note] */
var DATA = [["2026-11-23T09:12", "Elena", "Marchetti", "elena.m@example.com", "Yes", "Yes", "Yes", "Yes", "Wouldn't miss it \u2014 so happy for you both!"], ["2026-11-23T09:12", "Paolo", "Marchetti", "", "Yes", "Yes", "Yes", "Yes", "Plus one of Elena Marchetti"], ["2026-11-24T18:40", "James", "Whitfield", "jwhitfield@example.com", "Yes", "Yes", "No", "Yes", ""], ["2026-11-25T07:05", "Sarah", "Lindqvist", "sarah.l@example.com", "No", "No", "No", "No", "We're so sorry to miss it. Sending all our love from Stockholm."], ["2026-11-26T12:30", "Marco", "Benedetti", "marco.b@example.com", "Yes", "No", "Yes", "No", ""], ["2026-11-26T12:30", "Giulia", "Rossi", "", "Yes", "No", "Yes", "No", "Plus one of Marco Benedetti"], ["2026-11-27T20:14", "Anne", "Calloway", "anne.c@example.com", "Yes", "Yes", "Yes", "Yes", "Can we bring anything for the boat day?"], ["2026-11-28T10:02", "David", "Okafor", "d.okafor@example.com", "Yes", "Yes", "Yes", "No", ""], ["2026-11-29T16:45", "Rachel", "Kim", "rachelkim@example.com", "Yes", "Yes", "No", "Yes", ""], ["2026-12-01T08:20", "Tom", "Hargreaves", "tom.h@example.com", "No", "No", "No", "No", ""], ["2026-12-02T14:11", "Laura", "Fontaine", "laura.f@example.com", "Yes", "Yes", "Yes", "Yes", ""], ["2026-12-02T14:11", "Michael", "Fontaine", "", "Yes", "Yes", "Yes", "Yes", "Plus one of Laura Fontaine"], ["2026-12-03T19:30", "Chris", "Delgado", "chris.d@example.com", "Yes", "No", "No", "Yes", ""], ["2026-12-05T11:00", "Rachel", "Kim", "rachelkim@example.com", "Yes", "Yes", "Yes", "Yes", "Changed my flights \u2014 I can do the boat day now!"], ["2026-12-06T09:45", "Sophie", "Laurent", "sophie.l@example.com", "Yes", "Yes", "Yes", "Yes", ""]];
var SHEET_URL = "";

(function(){
  var EVENTS=[
    {key:'welcome',i:5,num:'05',dow:'Monday',dw:'Mon',name:'Welcome reception'},
    {key:'boat',i:6,num:'06',dow:'Tuesday',dw:'Tue',name:'Boat day & lunch on Lipari'},
    {key:'wedding',i:4,num:'07',dow:'Wednesday',dw:'Wed',name:'Wedding ceremony & reception',main:true},
    {key:'farewell',i:7,num:'08',dow:'Thursday',dw:'Thu',name:'Farewell luncheon'}];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function yes(v){return String(v).trim().toLowerCase()==='yes'}

  // 1. Normalize rows and keep only each person's latest reply.
  var rows=DATA.filter(function(r){return r&&String(r[1]||r[2]||'').trim()}).map(function(r){
    var note=String(r[8]||'').trim(), po=/^plus one of /i.test(note);
    return {t:new Date(r[0]),first:String(r[1]).trim(),last:String(r[2]).trim(),email:String(r[3]||'').trim(),
      wedding:r[4],welcome:r[5],boat:r[6],farewell:r[7],note:po?'':note,plusOf:po?note.replace(/^plus one of /i,'').trim():''};
  });
  var latest={},updated={};
  rows.forEach(function(g){var k=(g.first+' '+g.last).toLowerCase().replace(/\s+/g,' ');
    if(latest[k]){updated[k]=true; if(g.t>=latest[k].t)latest[k]=g}else latest[k]=g});
  var people=Object.keys(latest).map(function(k){var g=latest[k];g.key=k;g.updated=!!updated[k];return g});

  // 2. Attach plus ones to the guest who brought them.
  var byName={};people.forEach(function(g){byName[g.key]=g});
  people.forEach(function(g){g.guests=[]});
  people.forEach(function(g){if(g.plusOf){var host=byName[g.plusOf.toLowerCase().replace(/\s+/g,' ')];if(host&&host!==g){host.guests.push(g);g.host=host}}});
  var primaries=people.filter(function(g){return !g.host}).sort(function(a,b){return (a.last+a.first).localeCompare(b.last+b.first)});

  // 3. Headline numbers.
  var wedYes=people.filter(function(g){return yes(g.wedding)}).length;
  var dec=people.filter(function(g){return !yes(g.wedding)}).length;
  var pos=people.filter(function(g){return g.plusOf}).length;
  document.getElementById('s-wed').textContent=wedYes;
  document.getElementById('s-wed-t').textContent=wedYes===1?'guest so far':'guests so far';
  document.getElementById('s-rep').textContent=people.length;
  document.getElementById('s-dec').textContent=dec;
  document.getElementById('s-po').textContent=pos;
  var d=Math.ceil((new Date('2027-01-07T23:59:00')-new Date())/864e5);
  document.getElementById('days').textContent=d>1?d+' days left to reply':d===1?'1 day left to reply':'The RSVP deadline has passed';

  // 4. Event cards.
  document.getElementById('events').innerHTML=EVENTS.map(function(e){
    var y=people.filter(function(g){return yes(g[e.key])}).length, n=people.length-y, pct=people.length?Math.round(y/people.length*100):0;
    return '<div class="ev'+(e.main?' main':'')+'"><div class="day"><span class="num">'+e.num+'</span><span class="dow label"><span class="long">'+e.dow+'</span><span class="short">'+e.dw+'</span></span></div>'+
      '<div class="name">'+e.name+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="counts"><span><b>'+y+'</b>coming</span><span><b>'+n+'</b>not</span></div></div>';
  }).join('');

  // 5. Guest list with search + filters.
  var FILTERS=[
    {id:'all',label:'All',test:function(){return true}},
    {id:'yes',label:'Attending',test:function(g){return yes(g.wedding)}},
    {id:'no',label:'Declined',test:function(g){return !yes(g.wedding)}},
    {id:'po',label:'Plus ones',test:function(g){return g.guests.length>0}},
    {id:'note',label:'Notes',test:function(g){return !!g.note}}];
  var state={f:'all',q:''};
  function count(f){return primaries.filter(f.test).length}
  function drawChips(){document.getElementById('chips').innerHTML=FILTERS.map(function(f){
    return '<button class="chip" type="button" data-f="'+f.id+'" aria-pressed="'+(state.f===f.id)+'">'+f.label+'<span>'+count(f)+'</span></button>'}).join('')}
  function dots(g){if(!yes(g.wedding))return '';return '<div class="dots">'+[5,6,7,8].map(function(day,i){var k=['welcome','boat','wedding','farewell'][i];
    return '<span class="dot '+(yes(g[k])?(day===7?'w':'y'):'')+'" title="'+EVENTS[i].name+': '+(yes(g[k])?'Yes':'No')+'">'+(yes(g[k])?'✓':'–')+'</span>'}).join('')+'</div>'}
  function row(g){
    var sub=[];if(g.email)sub.push(esc(g.email));
    sub.push('Replied '+g.t.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    var tags=(g.updated?'<span class="tag">Updated</span>':'');
    var po=g.guests.map(function(p){return '<div class="meta" style="margin-top:4px"><span class="tag po" style="margin-left:0;margin-right:8px">Plus one</span>'+esc(p.first+' '+p.last)+'</div>'}).join('');
    return '<div class="guest'+(yes(g.wedding)?'':' declined')+'"><div class="who"><div class="nm">'+esc(g.first+' '+g.last)+tags+'</div>'+
      (yes(g.wedding)?'':'<div class="declined-line">Sending love from afar</div>')+
      '<div class="meta">'+sub.join(' · ')+'</div>'+po+'</div>'+dots(g)+
      (g.note?'<div class="note">“'+esc(g.note)+'”</div>':'')+'</div>';
  }
  function draw(){
    var f=FILTERS.filter(function(x){return x.id===state.f})[0], q=state.q.toLowerCase();
    var list=primaries.filter(f.test).filter(function(g){if(!q)return true;
      return [g.first+' '+g.last,g.email].concat(g.guests.map(function(p){return p.first+' '+p.last})).join(' ').toLowerCase().indexOf(q)>-1});
    document.getElementById('list').innerHTML=list.length?list.map(row).join(''):'<div class="empty">No guests match.</div>';
    document.getElementById('shown').textContent=list.length+(list.length===1?' reply':' replies');
    drawChips();
  }
  document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(b){state.f=b.dataset.f;draw()}});
  document.getElementById('q').addEventListener('input',function(e){state.q=e.target.value.trim();draw()});
  draw();

  document.getElementById('updated').textContent='Live from your RSVP sheet · updated '+new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  var a=document.getElementById('sheet'); if(SHEET_URL)a.href=SHEET_URL; else a.remove();
})();
</script>
</body>
</html>
